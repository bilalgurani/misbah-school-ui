<div class="shell">
  <aside class="sidenav">
    <div class="sidenav-content">
      <div class="sidenav-header">
        <div class="brand-logo">
          <!-- Calendar/Clock Badge Icon -->
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-name">Mishbah</span>
          <span class="brand-tag">Attendance System</span>
        </div>
      </div>
      <nav class="nav-list">
        <!-- Dashboard -->
        <a routerLink="/dashboard" routerLinkActive="active-link" class="nav-link">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
          </svg>
          <span>Home</span>
        </a>

        <!-- STUDENTS SECTION -->
         <div class="nav-section-title">STUDENTS</div>

         <a routerLink="/students" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: true}" class="nav-link">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/>
          </svg>
          <span>Directory</span>
        </a>

        <a routerLink="/student-attendance" routerLinkActive="active-link" class="nav-link">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3zM8 11c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
          </svg>
          <span>Attendance</span>
        </a>

        <a routerLink="/students/add" routerLinkActive="active-link" class="nav-link">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
          </svg>
          <span>Add Student</span>
        </a>
        <!-- TEACHERS SECTION -->
        <div class="nav-section-title">TEACHERS</div>

        <a routerLink="/teachers" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: true}" class="nav-link">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M4 13h6c.55 0 1-.45 1-1V4c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v8c0 .55.45 1 1 1zm0 8h6c.55 0 1-.45 1-1v-4c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v4c0 .55.45 1 1 1zm10 0h6c.55 0 1-.45 1-1v-8c0-.55-.45-1-1-1h-6c-.55 0-1 .45-1 1v8c0 .55.45 1 1 1zM13 4v4c0 .55.45 1 1 1h6c.55 0 1-.45 1-1V4c0-.55-.45-1-1-1h-6c-.55 0-1 .45-1 1z"/>
          </svg>
          <span>Directory</span>
        </a>

        <a routerLink="/teacher-attendance" routerLinkActive="active-link" class="nav-link">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M20 3H4c-1.1 0-2 .9-2 2v11c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 10c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm4 6H5v-.6c0-1.33 2.67-2 4-2s4 .67 4 2v.6zm4.25-3H14v-1.5h3.25V13zm0-3H14V8.5h3.25V10z"/>
          </svg>
          <span>Attendance</span>
        </a>

        <a routerLink="/teachers/add" routerLinkActive="active-link" class="nav-link">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
          </svg>
          <span>Add Teacher</span>
        </a>

        <!-- FINANCE SECTION -->
        <div class="nav-section-title">FINANCE</div>
        <a routerLink="/financials" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: true}" class="nav-link">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M4 13h6c.55 0 1-.45 1-1V4c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v8c0 .55.45 1 1 1zm0 8h6c.55 0 1-.45 1-1v-4c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v4c0 .55.45 1 1 1zm10 0h6c.55 0 1-.45 1-1v-8c0-.55-.45-1-1-1h-6c-.55 0-1 .45-1 1v8c0 .55.45 1 1 1zM13 4v4c0 .55.45 1 1 1h6c.55 0 1-.45 1-1V4c0-.55-.45-1-1-1h-6c-.55 0-1 .45-1 1z"/>
          </svg>
          <span>Financials</span>
        </a>
      </nav>
    </div>
  </aside>

  <main class="content">
    <header class="top-header">
      <div class="page-title">
      <!-- Optional breadcrumbs / title section -->
        <h3>Misbah Sana School, Nargund</h3>
    </div>
    <div class="user-menu-container">
      <button class="avatar-btn" (click)="toggleUserMenu()" aria-label="User menu">
        <img src="https://ui-avatars.com/api/?name=Khalid+Sheikh&background=e0e7ff&color=4f46e5" alt="User Avatar" class="avatar-img" />
      </button>
      <div class="dropdown-menu" [class.show]="isUserMenuOpen">
      <div class="user-info-header">
          <span class="user-name">Khalid Sheikh</span>
          <span class="user-role">Administrator</span>
          <span class="user-email">khalid.s@shaheen.edu</span>
        </div>
        <div class="dropdown-divider"></div>

        <ul class="dropdown-list">
          <li>
            <a href="#" (click)="$event.preventDefault(); closeMenu()">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
              <span>My Profile</span>
            </a>
          </li>
          <li>
            <a href="#" (click)="$event.preventDefault(); closeMenu()">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
              <span>Notification Settings</span>
            </a>
          </li>
          <li>
            <a href="#" (click)="$event.preventDefault(); closeMenu()">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 18h2v-2h-2v2zm1-16C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm0-14c-2.21 0-4 1.79-4 4h2c0-1.1.9-2 2-2s2 .9 2 2c0 2-3 1.75-3 5h2c0-2.25 3-2.5 3-5 0-2.21-1.79-4-4-4z"/></svg>
              <span>Help & Support</span>
            </a>
          </li>
        </ul>

        <div class="dropdown-divider"></div>

        <!-- Logout Button -->
        <div class="dropdown-footer">
          <button class="logout-action" (click)="onLogout()">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
            <span>Log Out</span>
          </button>
        </div>
    </div>
    </div>
    </header>

    <div class="page-body">
    <router-outlet></router-outlet>
  </div>
  </main>
</div>
