<div class="modal-backdrop" (click)="cancel()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>Record Student Exit</h3>
      <button class="close-btn" (click)="cancel()">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Exit Type</label>
        <select [(ngModel)]="form.exitType" class="form-input">
          <option value="TRANSFERRED_OUT">Transferred Out</option>
          <option value="DROPPED_OUT">Dropped Out</option>
        </select>
      </div>
      <div class="form-group">
        <label>Reason Category</label>
        <select [(ngModel)]="form.reasonCategory" class="form-input">
          <option value="FAMILY_RELOCATION">Family Relocation</option>
          <option value="ACADEMIC">Academic</option>
          <option value="FINANCIAL">Financial</option>
          <option value="PERSONAL">Personal</option>
          <option value="OTHER">Other</option>
        </select>
      </div>
      <div class="form-group">
        <label>Exit Date</label>
        <input type="date" [(ngModel)]="form.exitDate" class="form-input">
      </div>
      <div class="form-group">
        <label>Destination School</label>
        <input type="text" [(ngModel)]="form.destinationSchool" class="form-input">
      </div>
      <div class="form-group">
        <label>TC Number</label>
        <input type="text" [(ngModel)]="form.tcNumber" class="form-input">
      </div>
      <div class="form-group">
        <label>TC Issued Date</label>
        <input type="date" [(ngModel)]="form.tcIssuedOn" class="form-input">
      </div>
      <div class="form-group">
        <label>Notes</label>
        <textarea [(ngModel)]="form.reasonNotes" class="form-input" rows="3"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-primary" (click)="submitExit()">Submit Exit Record</button>
    </div>
  </div>
</div>
