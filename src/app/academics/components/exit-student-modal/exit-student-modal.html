<div class="modal-backdrop" (click)="cancel()">
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="exit-modal-title" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3 id="exit-modal-title">Record Student Exit</h3>
      <button type="button" class="close-btn" (click)="cancel()" aria-label="Close modal">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label for="exit-type">Exit Type</label>
        <select id="exit-type" [(ngModel)]="form.exitType" class="form-input">
          <option value="TRANSFERRED_OUT">Transferred Out</option>
          <option value="DROPPED_OUT">Dropped Out</option>
        </select>
      </div>
      <div class="form-group">
        <label for="exit-reason">Reason Category</label>
        <select id="exit-reason" [(ngModel)]="form.reasonCategory" class="form-input">
          <option value="FAMILY_RELOCATION">Family Relocation</option>
          <option value="ACADEMIC">Academic</option>
          <option value="FINANCIAL">Financial</option>
          <option value="PERSONAL">Personal</option>
          <option value="OTHER">Other</option>
        </select>
      </div>
      <div class="form-group">
        <label for="exit-date">Exit Date</label>
        <input id="exit-date" type="date" [(ngModel)]="form.exitDate" class="form-input">
      </div>
      <div class="form-group">
        <label for="exit-destination">Destination School</label>
        <input id="exit-destination" type="text" [(ngModel)]="form.destinationSchool" class="form-input">
      </div>
      <div class="form-group">
        <label for="exit-tc-number">TC Number</label>
        <input id="exit-tc-number" type="text" [(ngModel)]="form.tcNumber" class="form-input">
      </div>
      <div class="form-group">
        <label for="exit-tc-date">TC Issued Date</label>
        <input id="exit-tc-date" type="date" [(ngModel)]="form.tcIssuedOn" class="form-input">
      </div>
      <div class="form-group full-width">
        <label for="exit-notes">Notes</label>
        <textarea id="exit-notes" [(ngModel)]="form.reasonNotes" class="form-input" rows="3"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn-secondary" (click)="cancel()">Cancel</button>
      <button type="button" class="btn-primary" (click)="submitExit()">Submit Exit Record</button>
    </div>
  </div>
</div>
