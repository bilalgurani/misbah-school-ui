<div class="form-container">
  <app-toast></app-toast>
  
  <div class="page-header">
    <a routerLink="/teachers" class="back-link">
      <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
        <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
      </svg>
      <span>Back to Directory</span>
    </a>
    <h2>@if (isEditMode()) { Edit Teacher Profile } @else { Onboard New Teacher }</h2>
  </div>

  <div class="card">
    <form [formGroup]="teacherForm" (ngSubmit)="onSubmit()">

      <h3 class="section-title">Personal Details</h3>
      <div class="form-grid">
        <div class="form-group">
          <label for="fullName">Full Name <span class="required">*</span></label>
          <input id="fullName" type="text" formControlName="name" placeholder="Full name" required minlength="2" maxlength="100">
        </div>

        <div class="form-group">
          <label for="emailAddr">Email Address</label>
          <input id="emailAddr" type="email" formControlName="email" placeholder="e.g. name@school.com" maxlength="100">
        </div>

        <div class="form-group">
          <label for="phoneNum">Phone Number <span class="required">*</span></label>
          <input id="phoneNum" type="tel" formControlName="mobileNo" placeholder="10-digit number" pattern="[0-9]{10}" minlength="10" maxlength="10" inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
        </div>

        <div class="form-group">
          <label for="birthDate">Date of Birth</label>
          <input id="birthDate" type="date" formControlName="dob">
        </div>

        <div class="form-group full-width">
          <label for="streetAddr">Address</label>
          <input id="streetAddr" type="text" formControlName="address" placeholder="Street address" maxlength="255">
        </div>
      </div>

      <div class="divider"></div>

      <h3 class="section-title">Employment & Qualification</h3>
      <div class="form-grid">
        <div class="form-group">
          <label for="specRole">Subject Specialization / Role <span class="required">*</span></label>
          <input id="specRole" type="text" formControlName="subjectSpecialization" placeholder="e.g. HM, Mathematics" required maxlength="100">
        </div>

        <div class="form-group">
          <label for="qualif">Qualification</label>
          <input id="qualif" type="text" formControlName="qualification" placeholder="e.g. B.Ed, M.Sc" maxlength="100">
        </div>

        <div class="form-group">
          <label for="joinDate">Date of Joining <span class="required">*</span></label>
          <input id="joinDate" type="date" formControlName="dateOfJoining" required>
        </div>

        <div class="form-group">
          <label for="empStatus">Employment Status <span class="required">*</span></label>
          <select id="empStatus" formControlName="employmentStatus" required>
            <option value="ACTIVE">ACTIVE</option>
            <option value="INACTIVE">INACTIVE</option>
          </select>
        </div>
      </div>

      <div class="form-actions">
        <a routerLink="/teachers" class="btn-secondary">Cancel</a>
        <button type="submit" class="btn-primary" [disabled]="isSubmitting() || teacherForm.invalid">
          {{ isSubmitting() ? 'Saving...' : (isEditMode() ? 'Update Teacher' : 'Save Teacher') }}
        </button>
      </div>
    </form>
  </div>
</div>
