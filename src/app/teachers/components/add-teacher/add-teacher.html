<div class="form-container">
  <div class="page-header">
    <a routerLink="/teachers" class="back-link">← Back to Directory</a>
    <h2>@if (isEditMode()) { Edit Teacher Profile } @else { Onboard New Teacher }</h2>
  </div>

  <div class="card">
    <form [formGroup]="teacherForm" (ngSubmit)="onSubmit()">

      <h3 class="section-title">Personal Details</h3>
      <div class="form-grid">
        <div class="form-group">
          <label>Full Name <span class="required">*</span></label>
          <input type="text" formControlName="name" placeholder="Full name" required minlength="2" maxlength="100">
        </div>

        <div class="form-group">
          <label>Email Address</label>
          <input type="email" formControlName="email" placeholder="e.g. name@school.com" maxlength="100">
        </div>

        <div class="form-group">
          <label>Phone Number <span class="required">*</span></label>
          <input type="tel" formControlName="phoneNo" placeholder="10-digit number" pattern="[0-9]{10}" minlength="10" maxlength="10" inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
        </div>

        <div class="form-group">
          <label>Date of Birth</label>
          <input type="date" formControlName="dob">
        </div>

        <div class="form-group">
          <label>Address</label>
          <input type="text" formControlName="address" placeholder="Street address" maxlength="255">
        </div>
      </div>

      <div class="divider"></div>

      <h3 class="section-title">Employment & Qualification</h3>
      <div class="form-grid">
        <div class="form-group">
          <label>Subject Specialization / Role <span class="required">*</span></label>
          <input type="text" formControlName="subjectSpecialization" placeholder="e.g. HM, Mathematics" required maxlength="100">
        </div>

        <div class="form-group">
          <label>Qualification</label>
          <input type="text" formControlName="qualification" placeholder="e.g. B.Ed, M.Sc" maxlength="100">
        </div>

        <div class="form-group">
          <label>Date of Joining <span class="required">*</span></label>
          <input type="date" formControlName="dateOfJoining" required>
        </div>

        <div class="form-group">
          <label>Employment Status <span class="required">*</span></label>
          <select formControlName="employmentStatus" required>
            <option value="ACTIVE">ACTIVE</option>
            <option value="INACTIVE">INACTIVE</option>
          </select>
        </div>
      </div>

      <div class="form-actions">
        <a routerLink="/teachers" class="btn-secondary">Cancel</a>
        <button type="submit" class="btn-primary" [disabled]="isSubmitting() || teacherForm.invalid">
          {{ isSubmitting() ? 'Saving...' : (isEditMode() ? 'Update Teacher' : 'Save Teacher') }}
        </button>
      </div>
    </form>
  </div>
</div>
