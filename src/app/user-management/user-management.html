<form [formGroup]="userForm" (ngSubmit)="createTeacher()" class="user-form">
      <h3>Provision Teacher Account</h3>
      
      <div class="form-group">
        <label>Username</label>
        <input type="text" formControlName="username" class="form-control" />
      </div>

      <div class="form-group">
        <label>Initial Temporary Password</label>
        <input type="password" formControlName="password" class="form-control" />
      </div>

      <div class="form-group">
        <label>Teacher ID Link</label>
        <input type="number" formControlName="teacherId" class="form-control" placeholder="Maps to teachers.id" />
      </div>

      <button type="submit" class="btn-primary" [disabled]="userForm.invalid || isLoading()">
        {{ isLoading() ? 'Creating...' : 'Create Account' }}
      </button>
    </form>
