<div class="auth-wrapper">
      <form [formGroup]="passForm" (ngSubmit)="updatePassword()" class="auth-card">
        <h2>Change Password</h2>
        <p class="subtitle">Secure your account by updating your temporary password.</p>

        <div class="form-group">
          <label>Current / Temporary Password</label>
          <input type="password" formControlName="currentPassword" class="form-control" />
        </div>

        <div class="form-group">
          <label>New Password</label>
          <input type="password" formControlName="newPassword" class="form-control" />
        </div>

        <button type="submit" class="btn-primary" [disabled]="passForm.invalid || isLoading()">
          {{ isLoading() ? 'Updating...' : 'Update Password' }}
        </button>
      </form>
    </div>
