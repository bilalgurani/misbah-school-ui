<div class="form-container">
  <div class="page-header">
    <a routerLink="/students" class="back-link">← Back to Directory</a>
    <h2>@if (isEditMode()) { Edit Student Profile } @else { Admit New Student }</h2>
  </div>

  <div class="card">
    <form [formGroup]="studentForm" (ngSubmit)="onSubmit()">
      
      <h3 class="section-title">Personal Details</h3>
      <div class="form-grid">
        <div class="form-group">
          <label>Full Name <span class="required">*</span></label>
          <input type="text" formControlName="name" placeholder="Full name">
        </div>

        <div class="form-group">
          <label>Gender <span class="required">*</span></label>
          <select formControlName="gender">
            <option value="">Select Gender</option>
            <option value="M">Male</option>
            <option value="F">Female</option>
          </select>
        </div>

        <div class="form-group">
          <label>Date of Birth <span class="required">*</span></label>
          <input type="date" formControlName="dob">
        </div>

        <div class="form-group">
          <label>Aadhar No</label>
          <input type="text" formControlName="aadharNo" placeholder="12 digit Aadhar">
        </div>

        <div class="form-group">
          <label>Blood Group</label>
          <select formControlName="bloodGroup">
            <option value="">Select</option>
            <option value="A+">A+</option>
            <option value="B+">B+</option>
            <option value="O+">O+</option>
            <option value="AB+">AB+</option>
          </select>
        </div>
      </div>

      <div class="divider"></div>

      <h3 class="section-title">Parent & Contact Info</h3>
      <div class="form-grid">
        <div class="form-group">
          <label>Father Name <span class="required">*</span></label>
          <input type="text" formControlName="fatherName">
        </div>

        <div class="form-group">
          <label>Mother Name <span class="required">*</span></label>
          <input type="text" formControlName="motherName">
        </div>

        <div class="form-group">
          <label>Mobile No <span class="required">*</span></label>
          <input type="tel" formControlName="mobileNo" placeholder="10-digit number" pattern="[0-9]{10}" 
  minlength="10" 
  maxlength="10" >
        </div>

        <div class="form-group">
          <label>Address</label>
          <input type="text" formControlName="address">
        </div>

        <div class="form-group">
          <label>Emergency Contact Name</label>
          <input type="text" formControlName="emergencyContactName">
        </div>

        <div class="form-group">
          <label>Emergency Contact No</label>
          <input type="tel" formControlName="emergencyContactNo" pattern="[0-9]{10}" 
  minlength="10" 
  maxlength="10" >
        </div>
      </div>

      <div class="divider"></div>

      <h3 class="section-title">Academic & System Info</h3>
      <div class="form-grid">
        <div class="form-group">
          <label>Roll No</label>
          <input type="text" formControlName="rollNo">
        </div>

        <div class="form-group">
          <label>SATS No</label>
          <input type="text" formControlName="satsNo">
        </div>

        <div class="form-group">
          <label>Date of Admission</label>
          <input type="date" formControlName="dateOfAdmission">
        </div>

        <div class="form-group">
          <label>Enrollment Status <span class="required">*</span></label>
          <select formControlName="enrollmentStatus">
            <option value="ACTIVE">ACTIVE</option>
            <option value="INACTIVE">INACTIVE</option>
            <option value="LEFT">LEFT</option>
          </select>
        </div>
      </div>

      <div class="form-actions">
        <a routerLink="/students" class="btn-secondary">Cancel</a>
        <button type="submit" class="btn-primary" [disabled]="isSubmitting()">
          {{ isSubmitting() ? 'Saving...' : (isEditMode() ? 'Update Student' : 'Save Student') }}
        </button>
      </div>
    </form>
  </div>
</div>
