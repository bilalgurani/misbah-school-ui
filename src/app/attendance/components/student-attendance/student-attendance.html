<div class="attendance-container">
  <header class="header">
    <div class="filters">
      <div class="control-wrapper">
        <label class="control-label" for="sectionSelect">Class / Section</label>
        <div class="input-container">
          <svg class="control-icon" viewBox="0 0 24 24"><path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zM5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/></svg>
          <select id="sectionSelect" class="control custom-select" 
            [ngModel]="selectedSectionId()"
            (ngModelChange)="selectedSectionId.set(+$event); onFilterChange()">
            @for (section of classSections(); track section.id) {
              <option [value]="section.id">Class {{ section.displayName }}</option>
            }
          </select>
          <svg class="chevron-icon" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
        </div>
      </div>

      <div class="control-wrapper">
        <label class="control-label" for="dateSelect">Attendance Date</label>
        <div class="input-container">
          <svg class="control-icon" viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/></svg>
          <input id="dateSelect" type="date" class="control custom-date" 
            [ngModel]="selectedDate()"
            (ngModelChange)="selectedDate.set($event); onFilterChange()"/>
        </div>
      </div>
    </div>

    <div class="summary">
      <div class="stat">
        <span class="label">Total</span>
        <strong>{{ students().length }}</strong>
      </div>
      <div class="stat present">
        <span class="label">Present</span>
        <strong>{{ presentCount() }}</strong>
      </div>
      <div class="stat absent">
        <span class="label">Absent</span>
        <strong>{{ absentCount() }}</strong>
      </div>
    </div>
  </header>

  <div class="table-toolbar">
    <div class="search-box">
      <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input type="text" class="search-input" placeholder="Search student or roll no..." 
        [value]="searchQuery()"
        (input)="searchQuery.set($any($event.target).value)"/>
      @if (searchQuery()) {
        <button class="clear-btn" (click)="searchQuery.set('')" type="button">✕</button>
      }
    </div>
    <div class="bulk-actions">
      <button class="btn btn-outline-success" (click)="markAll('PRESENT')">Mark All Present</button>
      <button class="btn btn-outline-danger" (click)="markAll('ABSENT')">Mark All Absent</button>
    </div>
  </div>

  <div class="roster-container">
    <div class="roster-header">
      <span>Roll No</span>
      <span>Student Name</span>
      <span>Status</span>
      <span>Action</span>
    </div>

    <div class="roster-body">
      @for (student of filteredStudents(); track student.id) {
        <div class="roster-item" [class.is-absent]="student.status === 'ABSENT'">
          <div class="item-col col-roll">#{{ student.rollNo }}</div>
          
          <div class="item-col col-name">
            <div class="avatar">{{ student.name.charAt(0) }}</div>
            <span class="name-text">{{ student.name }}</span>
          </div>

          <div class="item-col col-status">
            <span class="badge" [class.badge-present]="student.status === 'PRESENT'" [class.badge-absent]="student.status === 'ABSENT'">
              {{ student.status }}
            </span>
          </div>

          <div class="item-col col-actions">
            <div class="btn-group">
              <button class="btn-status btn-present" [class.active]="student.status === 'PRESENT'" (click)="setStatus(student.id, 'PRESENT')">
                Present
              </button>
              <button class="btn-status btn-absent" [class.active]="student.status === 'ABSENT'" (click)="setStatus(student.id, 'ABSENT')">
                Absent
              </button>
            </div>
          </div>
        </div>
      }
    </div>
  </div>

  <footer class="form-footer">
    <button [disabled]="students().length === 0 || isSubmitting() || isLoading()" 
    class="submit-btn" (click)="submitAttendance()">Save & Submit Attendance</button>
  </footer>
</div>
